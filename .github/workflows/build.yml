name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE 8.0.15
        shell: pwsh
        run: |
          if (-not (Test-Path 'ThirdParty/JUCE-8.0.15/JUCE/CMakeLists.txt')) {
            New-Item -ItemType Directory -Force -Path 'ThirdParty/JUCE-8.0.15' | Out-Null
            git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git 'ThirdParty/JUCE-8.0.15/JUCE'
          }

      - name: Configure
        run: cmake -S . -B Build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build Build --config Release --target Polarity_VST3 Polarity_Standalone PolarityTests --parallel

      - name: Run tests
        run: .\Build\PolarityTests_artefacts\Release\PolarityTests.exe

      - name: Run pluginval
        shell: pwsh
        run: .\Tools\run_pluginval.ps1 -SkipGuiTests

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: .\Tools\package_release.ps1 -SkipBuild

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Polarity-win64
          path: |
            dist/Polarity-*-win64.zip
            dist/Polarity-*-win64-setup.exe
          if-no-files-found: error

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Polarity VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value

          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match CMake version $version"
          }

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/Polarity-*-win64.zip
            dist/Polarity-*-win64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
